apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: featuregen
data:
  FEATUREGEN_DSN: "postgresql://postgres:postgres@postgres:5432/featuregen"
  FEATUREGEN_AUDIT_HMAC_KEY: "local-dev-not-a-real-secret"
  # Dev auth stub: routes read X-User / X-Roles headers instead of a real session.
  FEATUREGEN_AUTH_STUB: "1"
  # Belt-and-braces: the initContainer already migrates; the app also auto-applies on boot (idempotent).
  FEATUREGEN_AUTO_MIGRATE: "1"
  # LLM provider ON: enables concept enrichment + Pass B synthesis. The ANTHROPIC_API_KEY itself is
  # supplied from the 'featuregen-llm' Secret via the Deployment env below — NEVER stored here.
  FEATUREGEN_LLM_PROVIDER: "anthropic"
  # Feature-generation + enrichment run on Opus 4.8 (overrides the claude-sonnet-5 code default) —
  # the governed feature-gen journey wants the strongest model at the proposal step.
  FEATUREGEN_LLM_MODEL: "claude-opus-4-8"
  # max_tokens ceiling for every LLM call. Opus 4.8 runs adaptive thinking at effort=high, and
  # THINKING TOKENS COUNT AGAINST max_tokens — the 4096 default gets consumed by thinking, truncating
  # the structured feature_ideas output → the truncation retry re-bills the whole (expensive) call and
  # exhausts the retry budget ("failed_into_clarification"). 32000 gives thinking + output ample room so
  # the call succeeds in ONE shot (no costly retries). NB: setting this above the model's real output
  # ceiling makes the provider 400 the request outright, so this is the safe practical max, not higher.
  FEATUREGEN_LLM_MAX_TOKENS: "32000"
  # Per-CALL wall-clock ceiling, seconds. The 60s default is mismatched with
  # FEATUREGEN_LLM_MAX_TOKENS=32000 + adaptive thinking at effort=high: a slow call dies at 60s and,
  # now that a timeout is classified non-retryable, fails its chunk outright — one billing, no
  # result, a stage truthfully reported as truncated. 300s covers the heaviest task (feature
  # generation), not just enrichment.
  #
  # WHAT THIS MULTIPLIES OUT TO, because the number alone does not say. `drive_structured_call` may
  # issue up to FIVE physical calls for one logical call (1 initial + 2 truncation retries + 2
  # repairs), and a truncation retry scales max_tokens AND this clock by the same ratio. With
  # FEATUREGEN_LLM_MAX_TOKENS=32000 against the driver's 64000 escalation ceiling that ratio caps at
  # 2x after a single step, so the provider ceilings sum to 300 + 4x600 = 2700s, plus up to 2s of
  # bounded transient backoff = 2702s. The Anthropic client is built with max_retries=0
  # (llm_claude._SDK_MAX_RETRIES) precisely so the SDK does not multiply that by a further 3x, as
  # its default of 2 would. NOTE THE INVERSION: LOWERING FEATUREGEN_LLM_MAX_TOKENS RAISES the worst
  # case, because a smaller ceiling escalates further before capping — at the 4096 code default the
  # ratio reaches 4x and the chain reaches 4500s.
  # tests/featuregen/intake/test_deployment_llm_bounds.py pins this arithmetic against both files.
  #
  # 2702s exceeds OVERLAY_ENRICH_STAGE_DEADLINE_S below, and that is a known, bounded overshoot: the
  # deadline is checked only BEFORE issuing each new chunk, so it cannot interrupt a call already in
  # flight, and the source advisory lock is held for the excess. Reaching 2702s needs four
  # consecutive calls that each run to ~their full ceiling AND return a complete-but-schema-invalid
  # body, because a single timeout ends the chain outright — so the realistic bad case is one hung
  # call at 300-600s. Bounding the LOGICAL call needs a deadline inside the driver; that is a code
  # change, deliberately not a deployment one.
  FEATUREGEN_LLM_TIMEOUT: "300"
  # Drift-freshness SLA = 30 days. This single-node demo cluster runs NO periodic drift scanner, so
  # the default 60-min SLA makes resolve_fact REVERIFY(drift_stale_pending_scan) as soon as a VERIFIED
  # fact's watermark ages past an hour — which silently drops is_grain/as_of and starves the planner.
  # A long SLA keeps VERIFIED facts resolvable for the demo. (Real deploys run a scanner instead.)
  OVERLAY_DRIFT_FRESHNESS_SLA_MIN: "43200"
  # Pass C — deterministic governed join DISCOVERY (implies governed-join routing for declared joins).
  # Declared/discovered joins become approved_join PROPOSALS awaiting two distinct platform-admins in
  # the Governance review screen. (No ANTHROPIC_API_KEY here — see the note on OVERLAY_TABLE_SYNTH.)
  OVERLAY_PASS_C: "1"
  # Pass B — governed table synthesis (grain/availability as PROPOSED-only, human-gated facts). The
  # two-phase wide-table fix handles the 126-column table. Now that the LLM provider is configured
  # above, Pass B (and concept enrichment) run for real — proposals are still human-gated.
  OVERLAY_TABLE_SYNTH: "1"
  # D4 semantic-binding stages (Delivery D): candidate shortlist then LLM-select proposals for
  # entity_assignment / currency_binding, human-gated in the Governance review screen. Proposals
  # REQUIRE candidates (the code warns if proposals is on while candidates is off), so both are on.
  OVERLAY_SEMANTIC_BINDING_CANDIDATES: "1"
  OVERLAY_SEMANTIC_BINDING_PROPOSALS: "1"
  # Cross-catalog entity bridges — the link between the SAME business entity in two catalogs (the
  # customer in the customer master vs. the customer on a transaction). Derived from resolved
  # concepts and proposed as human-gated facts; a bridge is operational only once VERIFIED. Needs
  # two catalogs loaded before it can find anything.
  OVERLAY_ENTITY_BRIDGES: "1"
  # Enrichment stage ceiling. The 240s default cut FTR's concept stage off at 126 columns (it needs
  # ~261s) and lost six columns' concepts, including `transaction_id`; CIB cleared it by ten
  # seconds. 30 minutes gives a wide real table room to finish. The per-run wall-clock budget
  # DERIVES from this, so one knob moves the whole ceiling. Trade-off: this stage holds the
  # per-source lock while it runs, so a slow provider can now block re-uploads of the SAME source
  # for longer — acceptable here, worth revisiting for concurrent ingestion.
  OVERLAY_ENRICH_STAGE_DEADLINE_S: "1800"
  # Per-stage physical-provider-call ceiling for batched enrichment. The 32 default is exactly
  # break-even at 126 columns (summary/synonyms both run over EVERY column at 8 per chunk, so a
  # 256-column catalog exhausts it with zero retries). 100 covers ~500 columns with headroom for
  # the degradation ladder while still tripping on a runaway loop. This is a COUNT bound, not a time
  # bound — the deadline above and the wall-clock budget derived from it remain what stops a slow
  # run, so raising this does not lengthen how long the stage may hold the source lock.
  OVERLAY_ENRICH_MAX_PROVIDER_CALLS: "100"
  # Release-A flags (verified-interfaces D8). FEATUREGEN_FEATURE_CONTEXT is SET ON here;
  # FEATUREGEN_DATASET_PROFILES below remains OFF and is still gated. Truthy set: 1/true/yes/on.
  # NOT AN APPROVAL RECORD: applying this ConfigMap IS the Release-A gate decision for the flag
  # below, and that decision has not been taken. This file states a value, never a sign-off.
  # Richer feature-generation context (v4 payload). ON: feature generation receives the full
  # semantic dossier — concept, definition, domain, ai_summary, semantic_terms, party_role,
  # concept ancestry, identifier namespace, cross-catalog links — plus `semantic_authority`,
  # the {field: "producer/strength"} map that makes an LLM proposal legible AS a proposal.
  # Rollback lever: FEATUREGEN_FEATURE_CONTEXT_VERSION="3" drops to the shipped v3 payload
  # WITHOUT falling back to the thin v1 menu.
  FEATUREGEN_FEATURE_CONTEXT: "1"
  # THE v3 ROLLBACK LEVER for the flag above. ABSENT BY DEFAULT — absent means v4, the shared
  # SemanticContextBundleV1 contract. Add `FEATUREGEN_FEATURE_CONTEXT_VERSION: "3"` here to fall
  # back to the shipped v3 payload (smaller prompts, no concept ancestry / identifier namespace /
  # party role / authority axes) WITHOUT dropping to the thin v1 menu, which is what turning
  # FEATUREGEN_FEATURE_CONTEXT off would do — a functional regression dressed as a safety valve.
  # Named here, commented, so an incident response edits a value instead of inventing a key: only
  # "3" and "4" are honoured, and a typo warns and silently keeps v4.
  # Dataset/catalog semantic profiles: profile API surfaces, upload narrative part, listing
  # display names — off ⟹ every new surface 404s and existing payloads stay byte-identical.
  FEATUREGEN_DATASET_PROFILES: "0"
  # Release-B serving/temporal policy surfaces. DEPENDS ON FEATUREGEN_DATASET_PROFILES and is
  # FAIL-CLOSED (D8): flipping this to "1" while the line above is "0" leaves the feature DISABLED
  # (routes still 404) and logs a loud startup warning — the dependency is enforced, not assumed.
  FEATUREGEN_SOURCE_TEMPORAL_SELECTION: "0"
  # Release-C generated two-leg crosswalk execution. DEPENDS ON the line above being ENABLED, and
  # unlike that dependency this one is a TRUE BOOT REFUSAL (D8): flipping this to "1" while the
  # line above is "0" makes the backend REFUSE TO START with a message naming both flags — it does
  # not degrade to a warning, because a crosswalk's mapping rows are chosen by the Release-B
  # temporal policy. Off ⟹ crosswalks stay discoverable and structurally non-executable.
  FEATUREGEN_CROSSWALK_EXECUTION: "0"
  # ── Materialization / code-gen (Phase G) — OFF on this cluster ────────────────────────────────
  # THE KILL SWITCH for the whole materialization lane. A compile runs inside the worker tick on the
  # worker's one connection, so while it runs the relay, the timers, the projections and every
  # poller wait for it. `kubectl -n featuregen edit configmap backend-config` + a pod restart is the
  # supported way to stop materialization WITHOUT stopping the worker; queued jobs stay `ready` and
  # drain when it comes back on. Truthy: 1/true/yes/on.
  #
  # STILL OFF, and the reason is now exactly ONE thing. The image gained a kedro/pyspark interpreter
  # at /opt/kedro-venv (see deploy/kind/Dockerfile.backend), so three of the four settings below have
  # genuinely usable values in THIS pod. The fourth, INVENTORY, does not: the only §0 inventory in the
  # repo is conf/environments/hdfc-local-inventory.yml, which is a TEMPLATE that `load_inventory`
  # refuses by design (`engine_versions.hive is missing or null`, and `tables: {}`), and it is not
  # copied into the image at all. Turning the switch on against it would not degrade politely — see
  # the paragraph below for what it would actually do.
  FEATUREGEN_MATERIALIZE_ENABLED: "0"
  # The four settings a deployment that turns the switch ON must also supply. Deliberately left
  # UNSET rather than pointed at paths this image does not contain: the lane resolves them only when
  # a job is claimed, names the missing one, and leaves the request queued for the fix — but that
  # patience is FINITE. A missing setting is treated as retryable, so the job is redelivered on the
  # queue's ordinary budget (12 attempts) and then DEAD-LETTERED, and because the lane never claimed
  # the request it writes no lifecycle: the request is left stranded at `requested` with nothing
  # queued behind it. Past that point re-triggering needs a FRESH idempotency key (the old one names
  # the stranded request, and the API answers 409), and the stranded row can never be CLOSED at all —
  # §3.2 ships no `requested → failed` edge, so T13's reconciler reports NO_LEGAL_TERMINAL and
  # changes nothing (DEFERRED-WORK A.35). An INVENTORY that exists but does not LOAD is the same
  # failure exactly: `load_inventory` raises before the lane accepts anything. So turn the switch on
  # and these four together — and only once the inventory is one a compilation can read.
  #   the directory each sealed project tree is written under (one subdirectory per generation).
  #   READY: no volume is mounted there, so a demo cluster writes to the pod's EPHEMERAL layer and a
  #   restart takes every sealed tree with it. `materialize_to` mkdirs its parents and the container
  #   runs as root, so the path needs no volume to work — it needs one to SURVIVE.
  # FEATUREGEN_MATERIALIZE_PROJECT_ROOT: "/var/lib/featuregen/materialize"
  #   the YAML of captured cluster facts every compilation reads (§0's typed input).
  #   NOT READY — the one blocker. Nothing in this repo or this image satisfies it; a compile needs
  #   engine versions AND a TableLayout per governed table, and nobody has captured a cluster.
  # FEATUREGEN_MATERIALIZE_INVENTORY: "/etc/featuregen/cluster-inventory.yaml"
  #   the interpreter the L0 build proof runs in; unset means no run is ever proven to build.
  #   READY: the venv is in the image and was proved to import kedro+pyspark and to build a real
  #   rendered project's pipeline. It proves a project BUILDS; it does not run Spark (no JVM).
  # FEATUREGEN_MATERIALIZE_L0_PYTHON: "/opt/kedro-venv/bin/python"
  #   that proof's bound in seconds; required with L0_PYTHON, and the worker's lease derives from it.
  #   READY at the sandbox/gate precedent of 900 — but note what it buys: the lease becomes 600 + 900
  #   = 1500s, and for that whole window one compile holds the single-threaded worker tick.
  # FEATUREGEN_MATERIALIZE_L0_TIMEOUT_SECONDS: "900"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: featuregen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        # Wait for Postgres and apply migrations before the app serves (retry until the DB is up).
        - name: migrate
          image: featuregen-backend:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: backend-config }
          command:
            - sh
            - -c
            - "until python -m featuregen migrate; do echo 'waiting for postgres...'; sleep 3; done"
      containers:
        - name: backend
          image: featuregen-backend:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: backend-config }
          env:
            # Live LLM key from the imperatively-created Secret (kubectl create secret generic
            # featuregen-llm). Kept out of the ConfigMap and out of git entirely.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: featuregen-llm, key: ANTHROPIC_API_KEY }
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: featuregen
spec:
  selector:
    app: backend
  ports:
    - { port: 8000, targetPort: 8000 }
