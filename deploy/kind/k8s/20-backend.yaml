apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: featuregen
data:
  FEATUREGEN_DSN: "postgresql://postgres:postgres@postgres:5432/featuregen"
  FEATUREGEN_AUDIT_HMAC_KEY: "local-dev-not-a-real-secret"
  # Dev auth stub: routes read X-User / X-Roles headers instead of a real session.
  FEATUREGEN_AUTH_STUB: "1"
  # Belt-and-braces: the initContainer already migrates; the app also auto-applies on boot (idempotent).
  FEATUREGEN_AUTO_MIGRATE: "1"
  # LLM provider ON: enables concept enrichment + Pass B synthesis. The ANTHROPIC_API_KEY itself is
  # supplied from the 'featuregen-llm' Secret via the Deployment env below — NEVER stored here.
  FEATUREGEN_LLM_PROVIDER: "anthropic"
  # Feature-generation + enrichment run on Opus 4.8 (overrides the claude-sonnet-5 code default) —
  # the governed feature-gen journey wants the strongest model at the proposal step.
  FEATUREGEN_LLM_MODEL: "claude-opus-4-8"
  # max_tokens ceiling for every LLM call. Opus 4.8 runs adaptive thinking at effort=high, and
  # THINKING TOKENS COUNT AGAINST max_tokens — the 4096 default gets consumed by thinking, truncating
  # the structured feature_ideas output → the truncation retry re-bills the whole (expensive) call and
  # exhausts the retry budget ("failed_into_clarification"). 32000 gives thinking + output ample room so
  # the call succeeds in ONE shot (no costly retries). NB: setting this above the model's real output
  # ceiling makes the provider 400 the request outright, so this is the safe practical max, not higher.
  FEATUREGEN_LLM_MAX_TOKENS: "32000"
  # Drift-freshness SLA = 30 days. This single-node demo cluster runs NO periodic drift scanner, so
  # the default 60-min SLA makes resolve_fact REVERIFY(drift_stale_pending_scan) as soon as a VERIFIED
  # fact's watermark ages past an hour — which silently drops is_grain/as_of and starves the planner.
  # A long SLA keeps VERIFIED facts resolvable for the demo. (Real deploys run a scanner instead.)
  OVERLAY_DRIFT_FRESHNESS_SLA_MIN: "43200"
  # Pass C — deterministic governed join DISCOVERY (implies governed-join routing for declared joins).
  # Declared/discovered joins become approved_join PROPOSALS awaiting two distinct platform-admins in
  # the Governance review screen. (No ANTHROPIC_API_KEY here — see the note on OVERLAY_TABLE_SYNTH.)
  OVERLAY_PASS_C: "1"
  # Pass B — governed table synthesis (grain/availability as PROPOSED-only, human-gated facts). The
  # two-phase wide-table fix handles the 126-column table. Now that the LLM provider is configured
  # above, Pass B (and concept enrichment) run for real — proposals are still human-gated.
  OVERLAY_TABLE_SYNTH: "1"
  # D4 semantic-binding stages (Delivery D): candidate shortlist then LLM-select proposals for
  # entity_assignment / currency_binding, human-gated in the Governance review screen. Proposals
  # REQUIRE candidates (the code warns if proposals is on while candidates is off), so both are on.
  OVERLAY_SEMANTIC_BINDING_CANDIDATES: "1"
  OVERLAY_SEMANTIC_BINDING_PROPOSALS: "1"
  # Cross-catalog entity bridges — the link between the SAME business entity in two catalogs (the
  # customer in the customer master vs. the customer on a transaction). Derived from resolved
  # concepts and proposed as human-gated facts; a bridge is operational only once VERIFIED. Needs
  # two catalogs loaded before it can find anything.
  OVERLAY_ENTITY_BRIDGES: "1"
  # Enrichment stage ceiling. The 240s default cut FTR's concept stage off at 126 columns (it needs
  # ~261s) and lost six columns' concepts, including `transaction_id`; CIB cleared it by ten
  # seconds. 30 minutes gives a wide real table room to finish. The per-run wall-clock budget
  # DERIVES from this, so one knob moves the whole ceiling. Trade-off: this stage holds the
  # per-source lock while it runs, so a slow provider can now block re-uploads of the SAME source
  # for longer — acceptable here, worth revisiting for concurrent ingestion.
  OVERLAY_ENRICH_STAGE_DEADLINE_S: "1800"
  # ── Materialization / code-gen (Phase G) — OFF on this cluster ────────────────────────────────
  # THE KILL SWITCH for the whole materialization lane. A compile runs inside the worker tick on the
  # worker's one connection, so while it runs the relay, the timers, the projections and every
  # poller wait for it. `kubectl -n featuregen edit configmap backend-config` + a pod restart is the
  # supported way to stop materialization WITHOUT stopping the worker; queued jobs stay `ready` and
  # drain when it comes back on. OFF here because this image has no kedro environment and no
  # captured cluster inventory, so every compile would honestly record "the build was never
  # proven". Truthy: 1/true/yes/on.
  FEATUREGEN_MATERIALIZE_ENABLED: "0"
  # The four settings a deployment that turns the switch ON must also supply. Deliberately left
  # UNSET rather than pointed at paths this image does not contain: the lane resolves them only when
  # a job is claimed, names the missing one, and leaves the request queued for the fix — but that
  # patience is FINITE. A missing setting is treated as retryable, so the job is redelivered on the
  # queue's ordinary budget (12 attempts) and then DEAD-LETTERED, and because the lane never claimed
  # the request it writes no lifecycle: the request is left stranded at `requested` with nothing
  # queued behind it. Past that point re-triggering needs a FRESH idempotency key (the old one names
  # the stranded request, and the API answers 409). So turn the switch on and these four together.
  #   the directory each sealed project tree is written under (one subdirectory per generation)
  # FEATUREGEN_MATERIALIZE_PROJECT_ROOT: "/var/lib/featuregen/materialize"
  #   the YAML of captured cluster facts every compilation reads (§0's typed input)
  # FEATUREGEN_MATERIALIZE_INVENTORY: "/etc/featuregen/cluster-inventory.yaml"
  #   the interpreter the L0 build proof runs in; unset means no run is ever proven to build
  # FEATUREGEN_MATERIALIZE_L0_PYTHON: "/opt/kedro-venv/bin/python"
  #   that proof's bound in seconds; required with L0_PYTHON, and the worker's lease derives from it
  # FEATUREGEN_MATERIALIZE_L0_TIMEOUT_SECONDS: "900"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: featuregen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        # Wait for Postgres and apply migrations before the app serves (retry until the DB is up).
        - name: migrate
          image: featuregen-backend:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: backend-config }
          command:
            - sh
            - -c
            - "until python -m featuregen migrate; do echo 'waiting for postgres...'; sleep 3; done"
      containers:
        - name: backend
          image: featuregen-backend:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: backend-config }
          env:
            # Live LLM key from the imperatively-created Secret (kubectl create secret generic
            # featuregen-llm). Kept out of the ConfigMap and out of git entirely.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: featuregen-llm, key: ANTHROPIC_API_KEY }
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: featuregen
spec:
  selector:
    app: backend
  ports:
    - { port: 8000, targetPort: 8000 }
