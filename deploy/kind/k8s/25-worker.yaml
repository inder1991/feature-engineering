# The durable-runtime worker — the process that keeps the read models current.
#
# WHY THIS EXISTS. `runtime/worker.py`'s own header records it: "Review BLOCKER #3 + MAJOR #11: the
# durable runtime was LIBRARY-ONLY — nothing in production drove the queue / relay / timers /
# projections, there was no entrypoint". The CODE half of that blocker landed (`run_forever` plus the
# `featuregen worker` subcommand); the DEPLOYMENT half did not, so on this cluster nothing had ever
# driven a tick. The only thing advancing the overlay projection was the inline `run_projection` call
# at the tail of an ingest (`overlay/upload/ingest.py`), which means projections only moved when
# somebody uploaded a CSV.
#
# THE FAILURE THAT FOUND IT (2026-08-09). A join confirm from the UI appended event 54; the overlay
# checkpoint stayed at 53 because no ingest followed. Suggestions are computed ON DEMAND and read
# GOVERNED values (grain, join authority) through `_governed_read`, whose gate is a bare
# `checkpoint < head` with NO tolerance — so every suggestions call failed closed, and would have
# kept failing until the next upload happened to drain the backlog.
#
# WHAT A TICK DRIVES, all of which had never run here: the job queue, the outbox relay, timers,
# overlay expiry, PRE-EXPIRY RENEWAL (opens re-verify tasks before a confirmed fact lapses), the
# catalog-drift scan, ingestion-run crash recovery, and the projections.
#
# REPLICAS. One is sufficient and is what this sets. More than one is SAFE rather than forbidden —
# the tick takes `FOR UPDATE SKIP LOCKED` on the queue and a global advisory lock on the shared
# stages, and `run_projection` claims its checkpoint row with `try_lock_checkpoint_nowait` — but a
# second replica buys nothing here and doubles the idle connection count.
#
# NO SERVICE, NO PROBES. This process serves no traffic, so it has no port to probe. Liveness is
# visible through the counters the tick publishes (`projection.lag.*`, `queue.depth`) rather than an
# HTTP endpoint.
#
# NO MIGRATE INIT CONTAINER, deliberately: `20-backend.yaml` already runs migrations before serving,
# and a second concurrent migrator racing it at rollout buys nothing. The worker instead waits for
# the schema to exist, so a cold cluster where both roll out together cannot crash-loop the worker
# while the backend is still migrating.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: featuregen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      initContainers:
        # Wait for the schema the backend's own init container applies. `migrate` is idempotent, so
        # this is a readiness WAIT rather than a competing migrator.
        - name: wait-for-schema
          image: featuregen-backend:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: backend-config }
          command:
            - sh
            - -c
            - "until python -m featuregen migrate; do echo 'waiting for postgres...'; sleep 3; done"
      containers:
        - name: worker
          image: featuregen-backend:local
          imagePullPolicy: IfNotPresent
          # ── MATERIALIZATION (Phase G / the formula-execution seam, task E2) ───────────────────
          #
          # THE WORKER IS THE ONLY PROCESS THAT COMPILES. The backend route validates a trigger,
          # mints a `materialization_request` and enqueues; every stage after that — resolve,
          # admit, compile, render, seal, L0, and (once the G-2 adapters exist) prepare/L1/submit/
          # publish — runs inside THIS pod's tick, on this pod's one connection.
          #
          # IT ALREADY HAS THE WHOLE `FEATUREGEN_MATERIALIZE_*` BLOCK, and that is why no `env:`
          # entry for any of those names appears below. `envFrom` above pulls the SAME
          # `backend-config` ConfigMap the backend reads (`20-backend.yaml`), which is where
          # `FEATUREGEN_MATERIALIZE_ENABLED` ("0" today) and the four commented companion settings
          # live. So the flip is ONE ConfigMap edit for both Deployments, and there is exactly one
          # place to read the deployment's materialization posture from.
          #
          # DO NOT "mirror" those names into the `env:` block below. Kubernetes gives `env`
          # precedence over `envFrom`, so a duplicated `FEATUREGEN_MATERIALIZE_ENABLED: "0"` here
          # would SILENTLY PIN THE WORKER OFF after an operator flipped the ConfigMap on — the
          # backend would accept triggers and nothing would ever claim them, which is precisely the
          # failure the duplication would have been added to prevent.
          #
          # WHAT THE OPERATOR MUST STILL DO, because a ConfigMap edit is not a restart: roll BOTH
          # `deployment/backend` and `deployment/worker` after the edit. A pod started before the
          # change keeps the old environment for its whole life.
          #
          # THE EXECUTION BLOCK IS THIS POD'S TOO, and more so than the rest. The eight
          # `FEATUREGEN_MATERIALIZE_METASTORE_*` / `_STAGING_BASE` / `_SUBMIT_*` settings (added by
          # the formula-execution seam's SUCCESSOR 2) name a metastore endpoint THIS pod dials, an
          # interpreter THIS pod launches, and a staging path THIS pod's submission writes under.
          # They are documented in full in `20-backend.yaml` because that is where the ConfigMap
          # lives; they are inherited here through the same `envFrom`, and the same rule applies —
          # DO NOT mirror them into `env:` below.
          #
          # AN ENDPOINT NOW EXISTS FOR THE SANDBOX, and one blocker remains that no manifest closes.
          # `sandbox/41-spark-thrift.yaml` (SUCCESSOR 3) stands up a Spark Thrift Server as a
          # ClusterIP Service `spark-thrift:10000`, on the SAME image and in front of the SAME
          # `postgres:5432/metastore` catalog as `40-spark.yaml`. It is opt-in — `deploy.sh` does not
          # apply it, `bash deploy/kind/sandbox/up.sh` does — so on a cluster where nobody ran that
          # script the block stays correctly unset. This image still has pyspark and NO JVM
          # (`Dockerfile.backend` says so and explains why), which is why this pod DIALS the endpoint
          # and cannot be one.
          #
          # THE REMAINING BLOCKER IS L1's THIRD QUESTION, and it is a property of the engine.
          # `can_read` asks `SHOW GRANT ROLE … ON TABLE …`; Spark's grammar rejects `SHOW GRANT` as
          # an unsupported Hive native command and never consults an authorization plugin, so the
          # adapter raises `MetastoreReadScopeUnanswerable` rather than guessing `True` or `False`.
          # No configuration changes that. Until an engine with an authorization model is available,
          # a run this pod drives reaches PREPARE_RUN and stops there — with the block unset it is
          # recorded RUN_FAILED naming the seams that were not configured, which is an honest
          # outcome rather than a crash and the one an operator should expect.
          #
          # `FEATUREGEN_MATERIALIZE_PROJECT_ROOT` IS ABOUT THIS POD'S DISK, not the backend's.
          # 20-backend.yaml documents it under the backend because that is where the whole block is
          # written, but the sealed project trees are written HERE, by this container, and no volume
          # is mounted at that path — so on a demo cluster they live on this pod's ephemeral layer
          # and a worker restart takes every sealed tree with it. `materialize_to` mkdirs its
          # parents and this container runs as root, so the path needs no volume to WORK; it needs
          # one to SURVIVE.
          envFrom:
            - configMapRef: { name: backend-config }
          env:
            # Same secret as the backend. The tick's stages are catalog/runtime work, not LLM calls,
            # but the composition root wires the same registries, so it gets the same environment
            # rather than a subtly different one.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: featuregen-llm, key: ANTHROPIC_API_KEY }
          # One tick per second: the projections a UI action depends on land well inside the time it
          # takes a user to navigate to the page that reads them.
          command: ["python", "-m", "featuregen", "worker", "--interval", "1.0"]
