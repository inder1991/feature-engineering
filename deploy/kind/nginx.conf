server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API surface -> backend service. Regex prefix match; this list, frontend/vite.config.ts's
    # API_PATHS, and the paths frontend/src/api.ts actually calls must agree — three places, so
    # test_nginx_proxy_covers_frontend_calls.py fails when they drift. A missing entry is not a
    # 404 a developer would recognise: nginx falls through to the SPA and answers a POST with
    # 405 Not Allowed, which reads like a backend bug and is not one.
    #
    # /catalogs is DISTINCT from /catalog — the regex is anchored with (/|$), so `catalog` does
    # not match `/catalogs`. proxy_pass forwards client headers (incl. X-User / X-Roles) by
    # default.
    location ~ ^/(uploads|search|sources|columns|join-path|features|contract|contracts|graph|health|integrations|syncs|governance|gate|catalog|catalogs|ingestion-runs|analysis|learning|data-sources|materialization-runs)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # SPA fallback for everything else.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
