server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API surface -> backend service. Regex prefix match; this list, frontend/vite.config.ts's
    # API_PATHS, and the paths frontend/src/api.ts actually calls must agree — three places, so
    # test_nginx_proxy_covers_frontend_calls.py fails when they drift. A missing entry is not a
    # 404 a developer would recognise: nginx falls through to the SPA and answers a POST with
    # 405 Not Allowed, which reads like a backend bug and is not one.
    #
    # /catalogs is DISTINCT from /catalog — the regex is anchored with (/|$), so `catalog` does
    # not match `/catalogs`. proxy_pass forwards client headers (incl. X-User / X-Roles) by
    # default.
    # /feature-runs is likewise DISTINCT from /features and /feature-execution, for the same
    # reason: the alternation matches whole names anchored by (/|$), so neither covers it.
    location ~ ^/(uploads|search|sources|columns|join-path|features|feature-runs|contract|contracts|graph|health|integrations|syncs|governance|gate|catalog|catalogs|ingestion-runs|analysis|learning|data-sources|materialization-runs|feature-execution|considered-revisions|formula-drafts|recipes|code-generation-jobs|build-sets|targets)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # Hashed assets are immutable by construction — the filename changes when the content does —
    # so they may be cached for ever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback for everything else. `no-cache` on index.html is what makes a deploy actually
    # REACH a browser that has visited before: without it the browser caches index.html
    # heuristically and keeps pointing at the OLD hashed bundle — "I deployed but you're still
    # seeing the previous build", which surfaced as a fix looking like it never shipped. no-cache
    # means revalidate-every-time, and the ETag makes that a 304, not a re-download.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
