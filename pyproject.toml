[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "featuregen"
version = "0.1.0"
description = "Contract-driven, banking-grade feature engineering platform (foundation/SP-0)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "FeatureGen Team" }]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "psycopg[binary]>=3.1",
    "jsonschema>=4.21",
    "python-ulid>=2.2",
    "PyJWT[crypto]>=2.8",
    # ed25519 detached signing of the 3B.4 3C-enablement-gate artifact (planner/signing.py). A DIRECT
    # dependency because the asymmetric-verify is the crux of the gate's trust model — it must not
    # rely on PyJWT's transitive pull.
    "cryptography>=42",
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    # The OpenMetadata connector's real transport (behind an injectable fetch seam; tests
    # never touch the network). Promoted from dev — it was already a test dependency.
    "httpx>=0.27",
    # Spec A §0's target-cluster inventory is a TYPED runtime input read from conf/environments/*.yml
    # by featuregen.materialize.inventory.load_inventory. PyYAML was already importable transitively
    # (pre-commit pulls it), and a runtime loader resting on somebody else's transitive dependency is
    # one lockfile resolution away from an ImportError that only appears in a deployed image.
    "PyYAML>=6",
    # The formula schema validates a WindowPolicy.timezone as a real IANA zone via zoneinfo.ZoneInfo;
    # python:3.11-slim (the deploy base) ships no system tz database, so declare the data package
    # explicitly — otherwise ZoneInfo raises ZoneInfoNotFoundError and the whole formula suite errors.
    "tzdata>=2024.1",
]

[project.scripts]
featuregen = "featuregen.__main__:main"
# BR-1: the banking-recipe debt audit (read-only; --baseline ratchets, --strict is BR-17's gate)
featuregen-recipe-audit = "featuregen.overlay.upload.recipe_audit_cli:main"

[project.optional-dependencies]
llm = [
    # Anthropic structured-output client (production-only, lazy-imported; CI uses FakeLLM). Floor
    # pinned to the deploy-proven version that supports output_config + json_schema outputs.
    "anthropic>=0.117,<1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-postgresql>=6.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "types-jsonschema>=4.21",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

# The SQL migrations are runtime data loaded from disk (db/migrations/*.sql) — WITHOUT this the wheel
# ships zero migrations and an installed release silently applies nothing to the schema.
[tool.setuptools.package-data]
"featuregen.db" = ["migrations/*.sql"]
# The strict proposal JSON Schema is runtime data loaded from disk by
# featuregen.formula.parse — without this the wheel ships no shape gate.
"featuregen.formula" = ["*.schema.json"]
# The FROZEN use-case recognition output contract (v2), loaded from disk and digest-checked at
# import by featuregen.overlay.upload.taxonomy.recognition_schema — without this the wheel cannot
# import the enrichment seam at all.
"featuregen.overlay.upload.taxonomy" = ["*.schema.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# importlib mode lets test modules with the same basename coexist across packages
# (e.g. tests/projections/test_migration.py and tests/featuregen/documents/test_migration.py)
# without requiring __init__.py shims; it is pytest's recommended mode.
# `-m "not eval"` keeps the manual/nightly gold-set quality gate (tests/eval, `eval` marker) OUT of
# default runs; run it explicitly with `pytest -m eval` (a command-line `-m` overrides this default).
addopts = "--import-mode=importlib -m 'not eval'"
markers = [
    "eval: manual/nightly quality-gate tests (gold-set enrichment eval; not run in default CI)",
    "real_backoff: opts OUT of the suite-wide transient-backoff zeroing (tests/conftest.py) so the test sees the REAL schedule. Only for tests that assert the schedule itself; they must still inject their own `sleep=` rather than actually waiting.",
]
# Hard per-test timeout so a hung/deadlocked test (e.g. concurrent DB-lock waits in
# the optimistic-concurrency / race tasks) FAILS fast instead of hanging the runner.
# "signal" (SIGALRM, main thread) interrupts blocked psycopg C calls, keeping any single
# test well under the build runner's stall watchdog.
timeout = 60
timeout_method = "signal"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
# `goldens/` holds RENDERED PROJECT bytes, not repository source: linting them would lint the
# artifact under test, and a fix applied to a golden is a golden that no longer matches what
# the renderer emits.
extend-exclude = ["docs", ".venv", "tests/featuregen/materialize/goldens"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PIE"]
ignore = [
    "E501",   # line length is the formatter's job
    "UP042",  # keep `class X(str, Enum)` — switching to StrEnum changes str() behavior
    "B905",   # zip() strict= is noise for our short, equal-length zips
]

[tool.ruff.lint.per-file-ignores]
# Test idioms we use deliberately.
"tests/**" = ["B011", "B017", "B007", "E402"]
# Importing a fixture from a sibling test module is how pytest shares one, and ruff reads the
# test's own parameter of the same name as redefining the import. Scoped to this ONE file rather
# than to `tests/**`, because F811 also catches two test functions with one name — a real defect
# that silently drops a test — and that check is worth keeping everywhere else.
"tests/featuregen/materialize/test_production_chain_v2.py" = ["F811"]
# Vendored VERBATIM from trailofbits/rfc8785.py (see its header); style-only
# findings are not worth diverging from the audited upstream bytes.
"src/featuregen/formula/_jcs.py" = ["UP006", "UP007", "PIE790", "B904"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
# Gradual typing: warn, don't block on every untyped corner yet (tightened over time).
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
